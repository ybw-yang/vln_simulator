name: vln_simulator
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - cmake
  - pip
  - numpy
  - pillow
  - matplotlib
  - pyyaml
  - scipy
  - tqdm
  - pip:
      # spawn_entity.py uses `env python3`; with conda active, lxml must be installed.
      - lxml
      - opencv-python==4.10.0.84
      - hydra-core
      - omegaconf
